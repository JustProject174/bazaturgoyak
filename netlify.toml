# Netlify Configuration File
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Директория с исходными файлами (корень проекта)
  publish = "."
  
  # Генерация js/config.js из .env или из переменных окружения Netlify (TELEGRAM_BOT, TELEGRAM_CHANNEL и др.)
  command = "node scripts/generate-config.js"

# Настройки редиректов и ошибок
# 404: файл 404.html в корне — Netlify автоматически показывает его при несуществующем URL.
# Явный редирект ниже дублирует это поведение (можно удалить, если хотите).

[[redirects]]
  # Редирект с www на без www (опционально)
  from = "https://www.goldensands.ru/*"
  to = "https://goldensands.ru/:splat"
  status = 301
  force = true

[[redirects]]
  # 404 страница (fallback для несуществующих путей)
  from = "/*"
  to = "/404.html"
  status = 404

# Режим техобслуживания: раскомментируйте блок ниже, когда нужно показать maintenance.html всем.
# Важно: закомментируйте редирект 404 выше (блок "404 страница"), иначе он сработает первым.
# После окончания работ верните 404 и закомментируйте этот блок.
# [[redirects]]
#   from = "/*"
#   to = "/maintenance.html"
#   status = 200
#   force = true

# Заголовки для безопасности и производительности
[[headers]]
  for = "/*"
  [headers.values]
    # Безопасность
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Кеширование
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    # Агрессивное кеширование для изображений
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "text/css; charset=utf-8"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/javascript; charset=utf-8"

# Плагины (опционально)
[[plugins]]
  package = "@netlify/plugin-lighthouse"
  
  # Проверка производительности
  [plugins.inputs.thresholds]
    performance = 0.9
    accessibility = 0.9
    best-practices = 0.9
    seo = 0.9

# Настройки для форм (если будут использоваться)
[functions]
  directory = "netlify/functions"
